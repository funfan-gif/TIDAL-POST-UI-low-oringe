<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">旧邮局港清晨</title>
  <desc id="desc">水彩绘本风的旧邮局港，木屋、邮灯、码头与远处海岛环绕平静潮面。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7caeb4"/>
      <stop offset=".58" stop-color="#c8d8c9"/>
      <stop offset="1" stop-color="#efd9ac"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#559493"/>
      <stop offset="1" stop-color="#214e58"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d7250"/>
      <stop offset="1" stop-color="#4d3c35"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#edbd62" stop-opacity=".4"/>
      <stop offset="1" stop-color="#edbd62" stop-opacity="0"/>
    </radialGradient>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light"/>
    </filter>
  </defs>

