    <path d="M34 190L123 111Q154 86 184 112L286 196" fill="url(#paper)" stroke="#6b8272" stroke-width="4" stroke-linejoin="round" filter="url(#ink)"/>
    <path d="M33 63L126 142Q156 166 187 142L290 66" fill="none" stroke="#9c8c6c" stroke-opacity=".55" stroke-width="3"/>
    <path d="M52 52Q76 67 96 57M220 58Q243 69 270 53" fill="none" stroke="#3c7776" stroke-width="5" stroke-linecap="round" opacity=".55"/>
