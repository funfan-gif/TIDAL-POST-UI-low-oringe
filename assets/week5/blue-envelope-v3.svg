    <linearGradient id="lining" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cc4bd"/><stop offset="1" stop-color="#4d8c89"/></linearGradient>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="5" result="g"/><feComposite in="g" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="multiply"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173f42" flood-opacity=".24"/></filter>
