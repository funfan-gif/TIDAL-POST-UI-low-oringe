<body><main class="board"><header><div class="name"><img src="../assets/icons/04_map.png" alt=""><div><h1>潮汐邮局 / 邮务航海图桌</h1><p>从“选择目的岛”到“规划通往固定目的地的航线”</p></div></div><div class="week">Week 04<br>核心界面与关键状态</div></header>
<div class="states"><figure><figcaption><span><b class="state-mark">✓</b>核心界面 / 航线安全</span><small>Route Valid</small></figcaption><a href="index.html?state=valid"><img src="qa/01-route-valid-1920x1080.png" alt="航点绕过雾礁浅滩，三个航段均可通行，确认航线可用"></a><p class="figure-note">固定委托目标 · 两枚可拖动航点 · 航向与航程实时汇总</p></figure><figure class="blocked"><figcaption><span><b class="state-mark">⚠</b>关键状态 / 航线不可达</span><small>Route Blocked</small></figcaption><a href="index.html?state=blocked"><img src="qa/02-route-blocked-1920x1080.png" alt="W1至W2穿越雾礁，危险航段变为虚线，危险区加斜线，确认被锁定并给出北侧恢复方向"></a><p class="figure-note">危险虚线 + 斜线浅滩 + 警告符号 + 原因与恢复路径 + 禁用确认</p></figure></div>
<div class="explanations"><section><h2>玩家此刻要做什么</h2><p>根据委托、坐标、潮汐和航行危险，规划一条通往蓝潮岛的安全邮务航线。</p></section><section><h2>最先需要看到</h2><p>当前位置、目的地、路线安全状态、潮汐窗口与确认操作。</p></section><section><h2>操作后发生什么</h2><p>拖动航点实时更新航向与距离；路线进入低潮暗礁时，确认被禁用并说明原因；调整航点后恢复可航行状态。</p></section></div>
